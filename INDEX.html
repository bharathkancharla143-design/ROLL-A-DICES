<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dice Royale</title>

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(5, 8, 20, .82),
                    rgba(18, 12, 45, .70)
                ),
                url("background.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND EFFECT
        ========================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 200, 255, .18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(150, 50, 255, .20),
                    transparent 30%
                );

            pointer-events: none;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .game-wrapper {
            width: min(94%, 470px);

            position: relative;
            z-index: 2;
        }


        /* =========================
           GAME CARD
        ========================== */

        .game-card {

            padding: 35px 32px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.16),
                    rgba(255,255,255,.05)
                );

            border: 1px solid rgba(255,255,255,.22);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.2);

            text-align: center;
        }


        /* =========================
           HEADER
        ========================== */

        .logo {
            width: 70px;
            height: 70px;

            margin: auto;
            margin-bottom: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    #00d4ff,
                    #7b2cff
                );

            box-shadow:
                0 10px 35px rgba(0,200,255,.35);

            transform: rotate(-5deg);
        }


        h1 {
            font-size: 34px;
            letter-spacing: 2px;

            margin-bottom: 7px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #7ddfff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .subtitle {
            color: rgba(255,255,255,.65);

            font-size: 14px;

            margin-bottom: 28px;
        }


        /* =========================
           SCORE BOARD
        ========================== */

        .score-board {

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-bottom: 25px;
        }


        .score {

            padding: 12px;

            border-radius: 14px;

            background: rgba(0,0,0,.20);

            border: 1px solid rgba(255,255,255,.10);
        }


        .score span {
            display: block;

            font-size: 12px;

            color: rgba(255,255,255,.55);

            margin-bottom: 4px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        .score strong {
            font-size: 24px;
        }


        #wins {
            color: #35f29a;
        }


        #losses {
            color: #ff5b70;
        }


        /* =========================
           INPUT
        ========================== */

        .input-label {
            display: block;

            text-align: left;

            font-size: 13px;

            font-weight: bold;

            color: rgba(255,255,255,.75);

            margin-bottom: 8px;
        }


        .input-box {
            position: relative;
        }


        input {

            width: 100%;

            height: 55px;

            padding: 0 20px;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,.15);

            outline: none;

            background: rgba(0,0,0,.30);

            color: white;

            font-size: 20px;

            text-align: center;

            transition: .25s;
        }


        input:focus {

            border-color: #00d4ff;

            box-shadow:
                0 0 0 3px rgba(0,212,255,.12),
                0 0 25px rgba(0,212,255,.12);
        }


        input::placeholder {
            color: rgba(255,255,255,.35);
        }


        /* Remove arrows */

        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }


        /* =========================
           DICE AREA
        ========================== */

        .dice-area {

            height: 210px;

            display: flex;

            justify-content: center;

            align-items: center;

            perspective: 1000px;
        }


        .dice {

            width: 135px;
            height: 135px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #dfe8f5
                );

            color: #151827;

            font-size: 82px;

            box-shadow:

                0 25px 45px rgba(0,0,0,.45),

                inset -8px -8px 15px rgba(0,0,0,.08),

                inset 8px 8px 15px rgba(255,255,255,.9);

            transform-style: preserve-3d;

            position: relative;
        }


        /* Dice glow */

        .dice::after {

            content: "";

            position: absolute;

            inset: -10px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #00d4ff,
                    #7b2cff
                );

            filter: blur(25px);

            opacity: .25;

            z-index: -1;
        }


        /* =========================
           ROLL ANIMATION
        ========================== */

        .rolling {

            animation:
                diceRoll 1.1s
                cubic-bezier(.2,.8,.3,1);
        }


        @keyframes diceRoll {

            0% {

                transform:
                    translateY(0)
                    rotateX(0deg)
                    rotateY(0deg)
                    rotateZ(0deg);

            }

            15% {

                transform:
                    translateY(-80px)
                    rotateX(180deg)
                    rotateY(180deg)
                    rotateZ(90deg);

            }

            30% {

                transform:
                    translateY(0)
                    rotateX(360deg)
                    rotateY(360deg)
                    rotateZ(180deg);

            }

            45% {

                transform:
                    translateY(-55px)
                    rotateX(540deg)
                    rotateY(540deg)
                    rotateZ(270deg);

            }

            60% {

                transform:
                    translateY(0)
                    rotateX(720deg)
                    rotateY(720deg)
                    rotateZ(360deg);

            }

            80% {

                transform:
                    translateY(-25px)
                    rotateX(900deg)
                    rotateY(1080deg)
                    rotateZ(450deg);

            }

            100% {

                transform:
                    translateY(0)
                    rotateX(1080deg)
                    rotateY(1440deg)
                    rotateZ(540deg);

            }
        }


        /* =========================
           BUTTON
        ========================== */

        .roll-button {

            width: 100%;

            height: 58px;

            border: none;

            border-radius: 15px;

            cursor: pointer;

            color: white;

            font-size: 17px;

            font-weight: 800;

            letter-spacing: 1px;

            background:
                linear-gradient(
                    135deg,
                    #00bfff,
                    #7357ff
                );

            box-shadow:
                0 10px 30px rgba(0,160,255,.3);

            transition: .25s;

            position: relative;

            overflow: hidden;
        }


        .roll-button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

            transition: .5s;
        }


        .roll-button:hover::before {
            left: 100%;
        }


        .roll-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 15px 40px rgba(0,180,255,.45);
        }


        .roll-button:active {
            transform: scale(.98);
        }


        .roll-button:disabled {

            opacity: .5;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           RESULT
        ========================== */

        .result {

            min-height: 70px;

            margin-top: 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }


        .result-title {

            font-size: 25px;

            font-weight: 900;

            letter-spacing: 1px;
        }


        .result-text {

            margin-top: 5px;

            font-size: 13px;

            color: rgba(255,255,255,.6);
        }


        .win {

            color: #35f29a;

            animation:
                winAnimation .5s ease;
        }


        .loss {

            color: #ff5b70;

            animation:
                lossAnimation .5s ease;
        }


        @keyframes winAnimation {

            0% {
                transform: scale(.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }


        @keyframes lossAnimation {

            0% {
                transform: translateX(-10px);
            }

            25% {
                transform: translateX(10px);
            }

            50% {
                transform: translateX(-7px);
            }

            75% {
                transform: translateX(7px);
            }

            100% {
                transform: translateX(0);
            }
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {

            margin-top: 18px;

            font-size: 11px;

            color: rgba(255,255,255,.35);

            letter-spacing: 1px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            .game-card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .dice {
                width: 115px;
                height: 115px;
                font-size: 70px;
            }

            .dice-area {
                height: 180px;
            }
        }

    </style>
</head>


<body>


<div class="game-wrapper">

    <div class="game-card">


        <!-- LOGO -->

        <div class="logo">
            🎲
        </div>


        <!-- TITLE -->

        <h1>DICE ROYALE</h1>

        <p class="subtitle">
            Predict the number • Roll the dice • Win
        </p>


        <!-- SCORE -->

        <div class="score-board">

            <div class="score">

                <span>Wins</span>

                <strong id="wins">
                    0
                </strong>

            </div>


            <div class="score">

                <span>Losses</span>

                <strong id="losses">
                    0
                </strong>

            </div>

        </div>


        <!-- INPUT -->

        <label class="input-label">
            YOUR PREDICTION
        </label>

        <input
            type="number"
            id="guess"
            min="1"
            max="6"
            placeholder="Choose 1 - 6"
        >


        <!-- DICE -->

        <div class="dice-area">

            <div
                class="dice"
                id="dice"
            >
                ⚀
            </div>

        </div>


        <!-- BUTTON -->

        <button
            class="roll-button"
            id="rollButton"
            onclick="rollDice()"
        >
            🎲 &nbsp; ROLL THE DICE
        </button>


        <!-- RESULT -->

        <div
            class="result"
            id="result"
        >

            <div class="result-title">
                Make your prediction
            </div>

            <div class="result-text">
                Choose a number between 1 and 6
            </div>

        </div>


        <div class="footer">
            GOOD LUCK • PLAY RESPONSIBLY
        </div>

    </div>

</div>



<script>

    /* =========================
       GAME VARIABLES
    ========================== */

    let wins = 0;
    let losses = 0;

    const diceFaces = [
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];


    /* =========================
       ROLL DICE
    ========================== */

    function rollDice() {

        const guessInput =
            document.getElementById("guess");

        const dice =
            document.getElementById("dice");

        const button =
            document.getElementById("rollButton");

        const result =
            document.getElementById("result");


        /* Get guess */

        const guess =
            Number(guessInput.value);


        /* Validate */

        if (
            !Number.isInteger(guess) ||
            guess < 1 ||
            guess > 6
        ) {

            result.innerHTML = `

                <div class="result-title loss">
                    ⚠ INVALID GUESS
                </div>

                <div class="result-text">
                    Please choose a number from 1 to 6
                </div>

            `;

            return;
        }


        /* Disable button */

        button.disabled = true;


        /* Rolling message */

        result.innerHTML = `

            <div class="result-title">
                🎲 ROLLING...
            </div>

            <div class="result-text">
                Let's see your result!
            </div>

        `;


        /* Restart animation */

        dice.classList.remove("rolling");

        void dice.offsetWidth;

        dice.classList.add("rolling");


        /* Generate random number */

        const rolledNumber =
            Math.floor(Math.random() * 6) + 1;


        /* Wait for animation */

        setTimeout(function () {


            /* Stop animation */

            dice.classList.remove("rolling");


            /* Display dice */

            dice.textContent =
                diceFaces[rolledNumber - 1];


            /* WIN */

            if (guess === rolledNumber) {

                wins++;

                document.getElementById("wins")
                    .textContent = wins;


                result.innerHTML = `

                    <div class="result-title win">
                        🎉 YOU WIN!
                    </div>

                    <div class="result-text">
                        Your guess: ${guess}
                        &nbsp; • &nbsp;
                        Dice: ${rolledNumber}
                    </div>

                `;

            }


            /* LOSS */

            else {

                losses++;

                document.getElementById("losses")
                    .textContent = losses;


                result.innerHTML = `

                    <div class="result-title loss">
                        ❌ YOU LOSE
                    </div>

                    <div class="result-text">
                        Your guess: ${guess}
                        &nbsp; • &nbsp;
                        Dice: ${rolledNumber}
                    </div>

                `;

            }


            /* Enable button */

            button.disabled = false;


        }, 1100);

    }


    /* =========================
       ENTER KEY SUPPORT
    ========================== */

    document
        .getElementById("guess")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                rollDice();

            }

        });

</script>


</body>
</html>
